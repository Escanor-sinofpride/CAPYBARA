<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Diagram of the plan view range with top and bottom clipping planes"><title>Diagram of the plan view range with top and bottom clipping planes</title><defs></defs><rect width="900" height="440" rx="20" fill="#0b1d20" stroke="#1f4a50"/><text x="450" y="40" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Plan view range  =  two clipping planes on one viewport</text><text x="450" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >Only the Top viewport is clipped - the rest of the model stays untouched</text><rect x="90" y="150" width="560" height="150" fill="#7fd6db" fill-opacity=".13"/><text x="104" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#7fd6db" text-anchor="start" >visible in plan</text><rect x="130" y="270" width="520" height="30" fill="#2a4c52" stroke="#3d7077"/><rect x="330" y="110" width="36" height="160" fill="#3d7077" stroke="#7fd6db" stroke-width="2"/><rect x="130" y="92" width="520" height="18" fill="none" stroke="#8fb3b7" stroke-dasharray="5 5"/><text x="140" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#8fb3b7" text-anchor="start" >roof</text><rect x="130" y="88" width="520" height="62" fill="#0b1d20" fill-opacity=".72"/><text x="380" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="start" >clipped away</text><line x1="90" y1="270" x2="680" y2="270" stroke="#ffd23f" stroke-width="3"/><text x="694" y="275" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="start" >Level  =  CPlane z</text><line x1="90" y1="150" x2="680" y2="150" stroke="#e0533d" stroke-width="3" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.4s" repeatCount="indefinite"/></line><text x="694" y="155" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#e0533d" text-anchor="start" >Top clip  =  level + cut height</text><text x="694" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="start" >default +1.2 m</text><line x1="90" y1="300" x2="680" y2="300" stroke="#5aa9ff" stroke-width="3" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" from="0" to="40" dur="1.4s" repeatCount="indefinite"/></line><text x="694" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#5aa9ff" text-anchor="start" >Bottom clip  =  level - depth</text><text x="694" y="324" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="start" >default 0.3 m</text><g transform="translate(200 80)"><ellipse cx="0" cy="0" rx="26" ry="14" fill="none" stroke="#e8f1f2" stroke-width="3"/><circle cx="0" cy="0" r="7" fill="#e8f1f2"/></g><path d="M200 98 V138" stroke="#7fd6db" stroke-width="3" stroke-linecap="round"><animate attributeName="opacity" values="1;0.25;1" keyTimes="0.0000;0.5000;1.0000" dur="1.4s" repeatCount="indefinite" /></path><path d="M192 130 L200 142 L208 130" stroke="#7fd6db" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="238" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Top view looks down</text><rect x="90" y="340" width="560" height="84" rx="12" fill="#17383e" stroke="#1f4a50"/><text x="110" y="366" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#7fd6db" text-anchor="start" >Result in the plan:</text><text x="110" y="390" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >the wall is cut at +1.2 m and drawn as poché; the slab edge below stays visible; the roof above disappears.</text><text x="110" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Change both numbers any time:  Levels  →  Plan view range (cut height / depth).</text></svg>
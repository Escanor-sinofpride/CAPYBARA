<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Animation: moving a level re-fits constrained walls while unconnected objects keep their height"><title>Animation: moving a level re-fits constrained walls while unconnected objects keep their height</title><defs></defs><rect width="900" height="480" rx="20" fill="#0b1d20" stroke="#1f4a50"/><text x="450" y="40" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Base / Top constraints</text><text x="450" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >Move a level  →  every object constrained to it re-fits automatically</text><line x1="60" y1="390" x2="540" y2="390" stroke="#e0533d" stroke-width="3" stroke-dasharray="10 6"/><circle cx="570" cy="390" r="17" fill="none" stroke="#e0533d" stroke-width="2"/><path d="M570 390 L570 373 A17 17 0 0 1 587 390 Z" fill="#e0533d"/><path d="M570 390 L570 407 A17 17 0 0 1 553 390 Z" fill="#e0533d"/><text x="62" y="418" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#e0533d" text-anchor="start" >Level 01  +0</text><line x1="60" x2="540" stroke="#e0533d" stroke-width="3" stroke-dasharray="10 6" y1="180" y2="180"><animate attributeName="y1" values="180;180;100;100;180;180" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /><animate attributeName="y2" values="180;180;100;100;180;180" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /></line><g><circle cx="570" cy="180" r="17" fill="none" stroke="#e0533d" stroke-width="2"/><path d="M570 180 L570 163 A17 17 0 0 1 587 180 Z" fill="#e0533d"/><path d="M570 180 L570 197 A17 17 0 0 1 553 180 Z" fill="#e0533d"/><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-80;0,-80;0,0;0,0" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite"/></g><text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#e0533d" x="62" y="152">Level 02  +3000<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.0000;0.2444;0.2778;0.6889;0.7222;1.0000" dur="9s" repeatCount="indefinite" /><animate attributeName="y" values="152;152;72;72;152;152" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /></text><text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#e0533d" x="62" y="152">Level 02  +4500<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2444;0.2778;0.6889;0.7222;1.0000" dur="9s" repeatCount="indefinite" /><animate attributeName="y" values="152;152;72;72;152;152" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /></text><rect x="200" y="189" width="44" height="201" fill="#2a4c52" stroke="#7fd6db" stroke-width="2"><animate attributeName="y" values="189;189;109;109;189;189" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /><animate attributeName="height" values="201;201;281;281;201;201" keyTimes="0.0000;0.1556;0.3333;0.6000;0.7778;1.0000" dur="9s" repeatCount="indefinite" /></rect><text x="222" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#7fd6db" text-anchor="middle" >Wall</text><text x="222" y="460" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="middle" >top = Level 02 − 100 mm</text><rect x="450" y="270" width="34" height="120" fill="#4a3a28" stroke="#c4925f" stroke-width="2"/><text x="467" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#c4925f" text-anchor="middle" >Column</text><text x="467" y="460" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="middle" >top unconnected</text><text x="467" y="476" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="middle" >(keeps its height)</text><rect x="620" y="110" width="250" height="188" rx="12" fill="#17383e" stroke="#1f4a50"/><text x="638" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#7fd6db" text-anchor="start" >Properties</text><text x="640" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Base Constraint</text><text x="850" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e8f1f2" text-anchor="end" >Level 01</text><text x="640" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Base Offset</text><text x="850" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e8f1f2" text-anchor="end" >0 mm</text><g opacity="0" ><rect x="630" y="209" width="230" height="26" rx="6" fill="#ffd23f" fill-opacity=".35"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1333;0.1667;0.7111;0.7444;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="640" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Top Constraint</text><text x="850" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e8f1f2" text-anchor="end" >Level 02</text><g opacity="0" ><rect x="630" y="239" width="230" height="26" rx="6" fill="#ffd23f" fill-opacity=".35"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1333;0.1667;0.7111;0.7444;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="640" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="start" >Top Offset</text><text x="850" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#e8f1f2" text-anchor="end" >−100 mm</text><text x="620" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#7fd6db" text-anchor="start" >Set it in 3 steps:</text><text x="620" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >1  Levels → Set constraints…</text><text x="620" y="374" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >2  Pick base level + offset</text><text x="620" y="396" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >3  Pick top level (or Unconnected) + offset</text></svg>
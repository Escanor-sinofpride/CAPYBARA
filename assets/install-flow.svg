<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Install flow: run the exe, Rhino opens, press Yes, toolbar appears"><title>Install flow: run the exe, Rhino opens, press Yes, toolbar appears</title><defs></defs><rect width="1000" height="230" rx="20" fill="#0b1d20" stroke="#1f4a50"/><line x1="150" y1="82" x2="855" y2="82" stroke="#1f4a50" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/><path id="route" d="M150 82 H855" fill="none"/><circle cx="150" cy="82" r="38" fill="#143338" stroke="#2a8f95" stroke-width="3"/><g opacity="0" ><circle cx="150" cy="82" r="38" fill="#7fd6db" fill-opacity=".25" stroke="#7fd6db" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0444;0.0778;0.2556;0.2889;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="150" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#e8f1f2" text-anchor="middle" >1</text><text x="150" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Run CAPYBARA_Setup.exe</text><text x="150" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >per-user, no admin rights</text><circle cx="400" cy="82" r="38" fill="#143338" stroke="#2a8f95" stroke-width="3"/><g opacity="0" ><circle cx="400" cy="82" r="38" fill="#7fd6db" fill-opacity=".25" stroke="#7fd6db" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2333;0.2667;0.4444;0.4778;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="400" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#e8f1f2" text-anchor="middle" >2</text><text x="400" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Setup finds Rhino 8</text><text x="400" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >and opens it for you</text><circle cx="650" cy="82" r="38" fill="#143338" stroke="#2a8f95" stroke-width="3"/><g opacity="0" ><circle cx="650" cy="82" r="38" fill="#7fd6db" fill-opacity=".25" stroke="#7fd6db" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4222;0.4556;0.6333;0.6667;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="650" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#e8f1f2" text-anchor="middle" >3</text><text x="650" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Press Yes in Rhino</text><text x="650" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >the installer confirms</text><circle cx="855" cy="82" r="38" fill="#143338" stroke="#2a8f95" stroke-width="3"/><g opacity="0" ><circle cx="855" cy="82" r="38" fill="#7fd6db" fill-opacity=".25" stroke="#7fd6db" stroke-width="4"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6111;0.6444;0.8222;0.8556;1.0000" dur="9s" repeatCount="indefinite" /></g><text x="855" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#e8f1f2" text-anchor="middle" >4</text><text x="855" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Toolbar + commands</text><text x="855" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >CATLevels, CATProjectBrowser ...</text><circle r="7" fill="#ffd23f"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.04;0.8;1" calcMode="linear"><mpath xlink:href="#route"/></animateMotion></circle></svg>
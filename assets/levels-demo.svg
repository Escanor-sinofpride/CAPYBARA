<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Animation: clicking a level head opens that level plan view with its CPlane"><title>Animation: clicking a level head opens that level plan view with its CPlane</title><defs><pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7fd6db" stroke-opacity=".10"/></pattern></defs><rect width="1000" height="560" rx="20" fill="#0b1d20" stroke="#1f4a50"/><text x="500" y="40" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#e8f1f2" text-anchor="middle" >Click a level head  →  choose what happens</text><text x="500" y="62" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#8fb3b7" text-anchor="middle" >Revit-style: the level drives the view, the CPlane and the view range</text><rect x="24" y="78" width="456" height="432" rx="14" fill="#102a2e" stroke="#1f4a50"/><text x="44" y="104" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="13" font-weight="600" fill="#7fd6db" text-anchor="start" >ELEVATION  ·  Perspective</text><rect x="520" y="78" width="456" height="432" rx="14" fill="#102a2e" stroke="#1f4a50"/><text x="540" y="104" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="13" font-weight="600" fill="#7fd6db" text-anchor="start" >PLAN  ·  Top</text><rect x="120" y="170" width="12" height="250" fill="#1b3c42" stroke="#3d7077"/><rect x="340" y="170" width="12" height="250" fill="#1b3c42" stroke="#3d7077"/><line x1="120" y1="170" x2="352" y2="170" stroke="#3d7077" stroke-width="7"/><line x1="56" y1="170" x2="410" y2="170" stroke="#e0533d" stroke-width="2" stroke-dasharray="9 6"/><circle cx="440" cy="170" r="17" fill="none" stroke="#e0533d" stroke-width="2"/><path d="M440 170 L440 153 A17 17 0 0 1 457 170 Z" fill="#e0533d"/><path d="M440 170 L440 187 A17 17 0 0 1 423 170 Z" fill="#e0533d"/><text x="58" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e0533d" text-anchor="start" >Level 02  +6000</text><line x1="120" y1="270" x2="352" y2="270" stroke="#3d7077" stroke-width="7"/><line x1="56" y1="270" x2="410" y2="270" stroke="#e0533d" stroke-width="2" stroke-dasharray="9 6"/><circle cx="440" cy="270" r="17" fill="none" stroke="#e0533d" stroke-width="2"/><path d="M440 270 L440 253 A17 17 0 0 1 457 270 Z" fill="#e0533d"/><path d="M440 270 L440 287 A17 17 0 0 1 423 270 Z" fill="#e0533d"/><text x="58" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e0533d" text-anchor="start" >Level 01  +3000</text><line x1="120" y1="420" x2="352" y2="420" stroke="#3d7077" stroke-width="7"/><line x1="56" y1="420" x2="410" y2="420" stroke="#e0533d" stroke-width="2" stroke-dasharray="9 6"/><circle cx="440" cy="420" r="17" fill="none" stroke="#e0533d" stroke-width="2"/><path d="M440 420 L440 403 A17 17 0 0 1 457 420 Z" fill="#e0533d"/><path d="M440 420 L440 437 A17 17 0 0 1 423 420 Z" fill="#e0533d"/><text x="58" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e0533d" text-anchor="start" >Level 00  +0</text><g opacity="0" ><line x1="56" y1="270" x2="410" y2="270" stroke="#ffd23f" stroke-width="3"/><circle cx="440" cy="270" r="17" fill="none" stroke="#ffd23f" stroke-width="2"/><path d="M440 270 L440 253 A17 17 0 0 1 457 270 Z" fill="#ffd23f"/><path d="M440 270 L440 287 A17 17 0 0 1 423 270 Z" fill="#ffd23f"/><text x="58" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="start" >Level 01  +3000</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1786;0.1964;0.8000;0.8179;1.0000" dur="14s" repeatCount="indefinite" /></g><circle cx="440" cy="270" r="0" fill="none" stroke="#7fd6db" stroke-width="3" opacity="0"><animate attributeName="r" values="0;0;34;34" keyTimes="0.0000;0.1857;0.2286;1.0000" dur="14s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0.0000;0.1857;0.2286;1.0000" dur="14s" repeatCount="indefinite" /></circle><circle cx="190" cy="314" r="0" fill="none" stroke="#7fd6db" stroke-width="3" opacity="0"><animate attributeName="r" values="0;0;34;34" keyTimes="0.0000;0.3214;0.3643;1.0000" dur="14s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0.0000;0.3214;0.3643;1.0000" dur="14s" repeatCount="indefinite" /></circle><g opacity="0" ><rect x="150" y="294" width="262" height="104" rx="10" fill="#17383e" stroke="#7fd6db" stroke-width="2"/><g opacity="0" ><rect x="154" y="299" width="254" height="30" rx="7" fill="#2a8f95" fill-opacity=".65"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2857;0.3000;0.3929;0.4071;1.0000" dur="14s" repeatCount="indefinite" /></g><text x="164" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e8f1f2" text-anchor="start" >Switch to plan view (Top + CPlane)</text><text x="164" y="351" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >Only set my view's CPlane to this level</text><text x="164" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#e8f1f2" text-anchor="start" >Edit this level (Levels window)</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2214;0.2393;0.4000;0.4179;1.0000" dur="14s" repeatCount="indefinite" /></g><g opacity="0" ><path d="M462 270 H506" stroke="#ffd23f" stroke-width="3" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0.0000;0.3857;0.4357;1.0000" dur="14s" repeatCount="indefinite" /></path><path d="M504 261 L518 270 L504 279 Z" fill="#ffd23f"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3857;0.4000;0.8000;0.8143;1.0000" dur="14s" repeatCount="indefinite" /></g><g opacity="0" ><rect x="540" y="118" width="416" height="330" fill="url(#pgrid)"/><rect x="596" y="190" width="300" height="190" fill="none" stroke="#e8f1f2" stroke-width="12"/><path d="M746 190 V300 M596 300 H746" stroke="#e8f1f2" stroke-width="7" fill="none"/><path d="M746 250 a28 28 0 0 1 28 -28" stroke="#7fd6db" stroke-width="2" fill="none"/><path d="M820 380 h34" stroke="#0b1d20" stroke-width="12"/><path d="M820 392 a34 34 0 0 1 34 -34" stroke="#7fd6db" stroke-width="2" fill="none"/><g stroke="#5fd08a" stroke-width="2.5"><path d="M566 424 H614" stroke="#e0533d"/><path d="M566 424 V376" stroke="#5fd08a"/></g><text x="620" y="428" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="12" font-weight="700" fill="#e0533d" text-anchor="start" >x</text><text x="560" y="370" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="12" font-weight="700" fill="#5fd08a" text-anchor="start" >y</text><rect x="548" y="124" width="190" height="26" rx="13" fill="#ffd23f"/><text x="643" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#1a1a1a" text-anchor="middle" >Level 01  ·  +3000</text><text x="640" y="428" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="12" font-weight="700" fill="#ffd23f" text-anchor="start" >CPlane  z = +3000 mm</text><rect x="750" y="118" width="196" height="50" rx="8" fill="#17383e" stroke="#1f4a50"/><text x="760" y="138" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="start" >cut plane   +1.2 m</text><text x="760" y="158" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="12" font-weight="400" fill="#8fb3b7" text-anchor="start" >view depth  0.3 m</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4000;0.4357;0.9000;0.9357;1.0000" dur="14s" repeatCount="indefinite" /></g><text x="500" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#8fb3b7" text-anchor="middle" >Same idea as Revit: select a level, land on its plan view.</text><g><path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L18 15 Z" fill="#fff" stroke="#0b1d20" stroke-width="1.4" /><animateTransform attributeName="transform" type="translate" values="250,470;250,470;438,269;438,269;188,312;188,312;380,480;380,480;250,470" keyTimes="0.0000;0.0857;0.1714;0.2429;0.3071;0.4000;0.4714;0.8571;1.0000" dur="14s" repeatCount="indefinite"/></g></svg>